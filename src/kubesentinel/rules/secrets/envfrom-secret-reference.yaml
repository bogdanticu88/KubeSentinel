id: KS-SECRET-002
name: Secret bulk-loaded into the environment
category: secrets
dimension: configuration
severity: low
description: >
  A container uses envFrom to load an entire Secret into its environment at
  once, rather than mounting it or selecting individual keys.
selector:
  kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob]
conditions:
  - field: containers[].envFrom[].secretRef
    operator: exists
risk_rationale: >
  envFrom exposes every key in the Secret as an environment variable, not
  just the ones the container was written to use. If the Secret ever grows
  to hold something this workload was not supposed to see, that value
  reaches the container automatically the next time it restarts, with no
  code change and no review. It carries the same leak risk as a single
  env-var reference, multiplied across the whole Secret.
remediation: |
  volumes:
    - name: creds
      secret:
        secretName: my-secret
  # mount the secret and read only the keys this container actually needs
references:
  - https://kubernetes.io/docs/concepts/configuration/secret/#risks

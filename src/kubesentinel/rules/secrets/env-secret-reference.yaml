id: KS-SECRET-001
name: Secret consumed as an environment variable
category: secrets
dimension: configuration
severity: low
description: >
  A container reads a Secret value into an environment variable instead of
  mounting it as a file.
selector:
  kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob]
conditions:
  - field: containers[].env[].valueFrom.secretKeyRef
    operator: exists
risk_rationale: >
  Environment variables are easier to leak by accident than a mounted file.
  They show up whole in crash dumps and core files, in `docker inspect` and
  similar tooling, and are inherited by every child process the container
  spawns, including ones that were never meant to see the secret. A mounted
  file can be read with the same access an env var would need, without
  handing the value to everything downstream of the process by default.
remediation: |
  volumes:
    - name: creds
      secret:
        secretName: my-secret
  # then mount it into the container and read the file instead of an env var
references:
  - https://kubernetes.io/docs/concepts/configuration/secret/#risks

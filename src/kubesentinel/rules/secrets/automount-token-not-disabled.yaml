id: KS-SECRET-003
name: ServiceAccount token automount not disabled
category: secrets
dimension: configuration
severity: low
description: >
  A workload does not set automountServiceAccountToken to false, so its
  ServiceAccount's API token is mounted into every pod whether or not the
  workload ever calls the Kubernetes API.
selector:
  kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob]
conditions:
  - field: automountServiceAccountToken
    operator: not_equals
    value: false
risk_rationale: >
  Most workloads never call the Kubernetes API and have no use for this
  token, it is mounted purely because that is the default. If the workload
  is compromised, that token is sitting on disk in the container ready to
  be used against the API server with whatever permissions its
  ServiceAccount holds, permissions the attacker did not otherwise need to
  find or steal. Disabling automount removes a credential from workloads
  that were never going to use it.
remediation: |
  spec:
    automountServiceAccountToken: false
  # if the workload genuinely needs API access, mount a projected, time
  # limited token instead of the long lived default
references:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting

id: KS-RBAC-005
name: default ServiceAccount granted a role
category: rbac
dimension: identity
severity: high
description: >
  A RoleBinding or ClusterRoleBinding lists the default ServiceAccount as
  a subject.
selector:
  kinds: [RoleBinding, ClusterRoleBinding]
conditions:
  - field: subjects[].name
    operator: equals
    value: default
risk_rationale: >
  Every namespace has a default ServiceAccount, and every pod that does
  not explicitly request a different one is mounted with its token. Any
  workload deployed without much thought, including ones an attacker
  brings in themselves after gaining any ability to create pods, inherits
  whatever this binding grants. Binding real permissions to it instead of
  a purpose-built ServiceAccount means the blast radius of "any pod in
  this namespace" is now whatever this role can do.
remediation: |
  Create a dedicated ServiceAccount per workload and bind roles to that
  instead, leave the default ServiceAccount with no bindings and
  automountServiceAccountToken set to false.
references:
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
